<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ピタフレ — ゲーム仲間マッチング</title>
    <meta
      name="description"
      content="今すぐ一緒にゲームを遊べる仲間を、安全にマッチング。本人確認とマナースコアで安心。"
    />

    <!-- OGP(リンク共有カード)。og:url / og:image は独自ドメインの絶対URLで指定する -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ピタフレ" />
    <meta property="og:title" content="ピタフレ — ゲーム仲間マッチング" />
    <meta
      property="og:description"
      content="ピタッと合うゲーム仲間と、一緒に遊ぶ時間を安心して予約。承認制・通報ブロック・本人確認つき。"
    />
    <meta property="og:url" content="https://pitafure.com/" />
    <meta property="og:image" content="https://pitafure.com/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ピタフレ — ゲーム仲間マッチング" />
    <meta
      name="twitter:description"
      content="ピタッと合うゲーム仲間と、一緒に遊ぶ時間を安心して予約。承認制・通報ブロック・本人確認つき。"
    />
    <meta name="twitter:image" content="https://pitafure.com/ogp.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#edecf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2a2440" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ピタフレ" />
    <!--
      フォントは自己ホスト。Google Fonts から読み込むと、利用者の端末から
      第三者(Google)への送信が発生し、電気通信事業法の外部送信規律の
      該当性判断と、該当する場合の公表・通知の維持管理が恒久的に必要になる。
      弁護士回答 Q20 は自己ホストを推奨。実体は public/fonts/dotgothic16/。
      **ここに外部ホストの <link> を戻さないこと。**
    -->
    <link href="/fonts/dotgothic16.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
