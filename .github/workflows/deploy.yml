# main への push で Cloudflare へデプロイする。
#
# **なぜ GitHub Actions に移したか**
# Cloudflare 側の自動ビルド(Workers Builds)が、2026-08-03 に**無言で止まった**。
# 6回 push して1つもビルドが積まれず、しかも Cloudflare の画面には
# 成功したバージョンしか出ないため、止まっていること自体に気づけなかった。
# ここに置けば、失敗すれば GitHub 上で赤くなり、通知が飛ぶ。
#
# **最後の「反映の確認」が本体**。デプロイが成功したと報告されても、
# 実際に配信されているとは限らない。ビルドしたアセット名が本番から返って
# くるまで確かめて、返らなければ落とす。
name: デプロイ

on:
  push:
    branches: [main]
  # 手動でも流せるようにする(ロールバック後の再デプロイ等)
  workflow_dispatch:

# 連続で push したときに古いほうが後から上書きしないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json のとおりに入れる(npm install ではない)
      - run: npm ci

      # Supabase の接続情報は .env.production がリポジトリに入っているので、
      # ここで環境変数を渡す必要はない。**秘密の値はここに増やさないこと。**
      - run: npm run build

      # 何が配信されているかを、**コミットで**言えるようにする。
      # アセット名(index-XXXX.js)は同じコミットでもビルドのたびに変わるので、
      # 「反映されたか」の判定には使えない(2026-08-03に判定を誤った)。
      - name: 版の目印を置く
        run: |
          printf '{"commit":"%s","builtAt":"%s","ref":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REF_NAME" > dist/version.json
          cat dist/version.json

      # cloudflare/wrangler-action は使わない。**wrangler 3.90.0 を勝手に入れる**ため。
      # 3.90.0 は wrangler.jsonc(JSONC形式の設定)を読めず、設定が正しいのに
      # 「Missing entry-point」で落ちる(2026-08-03)。
      # wrangler は devDependencies に固定してあるので、npx はそれを使う。
      #
      # **アカウントIDは渡さない。** トークンが1つのアカウントに限定されていれば、
      # wrangler が自分で判別する。32桁の英数字を手で書き写す作業は、
      # 1文字ずれても「object identifier is invalid [code: 7003]」としか出ず、
      # 原因に辿り着きにくい(2026-08-03に1文字欠けで落ちた)。
      # 将来アカウントを増やしたら、そのときだけ CLOUDFLARE_ACCOUNT_ID を足す。
      - name: Cloudflare へデプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 落ちたときに**原因まで分かる**ようにしておく。
      # 「反映されていない」だけでは、ワーカー・独自ドメインの経路・エッジキャッシュの
      # どれが悪いのか切り分けられず、毎回ダッシュボードを見に行くことになる。
      - name: 反映の確認
        env:
          WORKERS_DEV: https://pita-friends.sunny-rainy1115.workers.dev
        run: |
          echo "配信されるはずのコミット: $GITHUB_SHA"

          # **3分待つ。** Cloudflare の伝播は60秒では終わらないことがあり、
          # 短く切ると「成功したデプロイ」を失敗と報告してしまう(2026-08-03)。
          for i in $(seq 1 18); do
            if curl -sf "https://pitafure.com/version.json?cb=$GITHUB_RUN_ID$i" | grep -q "$GITHUB_SHA"; then
              echo "OK: 本番が $GITHUB_SHA を返している(${i}回目)"
              exit 0
            fi
            echo "まだ切り替わっていない。10秒待って再確認 ($i/18)"
            sleep 10
          done

          echo "--- 切り分け ---"
          echo "pitafure.com  : $(curl -sf "https://pitafure.com/version.json?cb=$GITHUB_RUN_ID" || echo '(取得できず)')"
          echo "workers.dev   : $(curl -sf "$WORKERS_DEV/version.json?cb=$GITHUB_RUN_ID" || echo '(取得できず)')"
          echo "pitafure.com のヘッダ:"
          curl -sSI https://pitafure.com/ | grep -iE '^(cf-cache-status|age|cache-control|server|cf-ray):' || true

          echo "::error::デプロイは成功したが、本番が $GITHUB_SHA を返さない。上の2行を見て、別の配信経路(Cloudflare 側の Git 連携)が上書きしていないか確認すること"
          exit 1
