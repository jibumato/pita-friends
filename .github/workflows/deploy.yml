# main への push で Cloudflare へデプロイする。
#
# **なぜ GitHub Actions に移したか**
# Cloudflare 側の自動ビルド(Workers Builds)が、2026-08-03 に**無言で止まった**。
# 6回 push して1つもビルドが積まれず、しかも Cloudflare の画面には
# 成功したバージョンしか出ないため、止まっていること自体に気づけなかった。
# ここに置けば、失敗すれば GitHub 上で赤くなり、通知が飛ぶ。
#
# **最後の「反映の確認」が本体**。デプロイが成功したと報告されても、
# 実際に配信されているとは限らない。ビルドしたアセット名が本番から返って
# くるまで確かめて、返らなければ落とす。
name: デプロイ

on:
  push:
    branches: [main]
  # 手動でも流せるようにする(ロールバック後の再デプロイ等)
  workflow_dispatch:

# 連続で push したときに古いほうが後から上書きしないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json のとおりに入れる(npm install ではない)
      - run: npm ci

      # Supabase の接続情報は .env.production がリポジトリに入っているので、
      # ここで環境変数を渡す必要はない。**秘密の値はここに増やさないこと。**
      - run: npm run build

      # cloudflare/wrangler-action は使わない。**wrangler 3.90.0 を勝手に入れる**ため。
      # 3.90.0 は wrangler.jsonc(JSONC形式の設定)を読めず、設定が正しいのに
      # 「Missing entry-point」で落ちる(2026-08-03)。
      # wrangler は devDependencies に固定してあるので、npx はそれを使う。
      #
      # **アカウントIDは渡さない。** トークンが1つのアカウントに限定されていれば、
      # wrangler が自分で判別する。32桁の英数字を手で書き写す作業は、
      # 1文字ずれても「object identifier is invalid [code: 7003]」としか出ず、
      # 原因に辿り着きにくい(2026-08-03に1文字欠けで落ちた)。
      # 将来アカウントを増やしたら、そのときだけ CLOUDFLARE_ACCOUNT_ID を足す。
      - name: Cloudflare へデプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 落ちたときに**原因まで分かる**ようにしておく。
      # 「反映されていない」だけでは、ワーカー・独自ドメインの経路・エッジキャッシュの
      # どれが悪いのか切り分けられず、毎回ダッシュボードを見に行くことになる。
      - name: 反映の確認
        env:
          WORKERS_DEV: https://pita-friends.sunny-rainy1115.workers.dev
        run: |
          ASSET=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "配信されるはずのアセット: $ASSET"

          for i in 1 2 3 4 5 6; do
            if curl -sf https://pitafure.com/ | grep -q "$ASSET"; then
              echo "OK: 本番が $ASSET を返している"
              exit 0
            fi
            echo "まだ切り替わっていない。10秒待って再確認 ($i/6)"
            sleep 10
          done

          echo "--- 切り分け ---"
          # ①ワーカー自体は新しいか(独自ドメインを通らない経路で見る)
          if curl -sf "$WORKERS_DEV/" | grep -q "$ASSET"; then
            WORKER=新しい
          else
            WORKER=古い
          fi
          # ②キャッシュを迂回すると新しいか
          if curl -sf "https://pitafure.com/?cb=$GITHUB_RUN_ID" | grep -q "$ASSET"; then
            BYPASS=新しい
          else
            BYPASS=古い
          fi
          echo "workers.dev: $WORKER / キャッシュ迂回: $BYPASS"
          echo "pitafure.com のヘッダ:"
          curl -sSI https://pitafure.com/ | grep -iE '^(cf-cache-status|age|cache-control|server|cf-ray):' || true

          if [ "$WORKER" = 古い ]; then
            echo "::error::ワーカー自体が古い。デプロイは通っているのに反映されていないので、Cloudflare のバージョン(段階的デプロイ)を確認すること"
          elif [ "$BYPASS" = 新しい ]; then
            echo "::error::**エッジキャッシュが古い応答を保持している。** Cloudflare の pitafure.com → キャッシュ → 「すべてをパージ」を実行すること"
          else
            echo "::error::独自ドメイン pitafure.com がこのワーカーに向いていない。Cloudflare の pita-friends → ドメイン を確認すること"
          fi
          exit 1
